{% load static %}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login Kelompok | Praktikum Perencanaan Tambang
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: #ffffff;

            padding: 36px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #0f172a;

            color: #ffffff;

            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0;

            text-align: center;

            font-size: 24px;
        }

        .subtitle {
            margin: 8px 0 28px;

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.5;
        }

        .message {
            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            background: #fef2f2;

            color: #991b1b;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #0f172a;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #1e293b;
        }

        .back {
            margin-top: 22px;

            text-align: center;
        }

        .back a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }

        @media (max-width: 480px) {

            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            PT
        </div>

        <h1>
            Login Kelompok
        </h1>

        <div class="subtitle">
            Portal Praktikum Perencanaan Tambang
        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form
            method="post"
            action="{% url 'praktikum:login_kelompok' %}"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username Kelompok
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit">
                Masuk ke Dashboard
            </button>

        </form>


        <div class="back">

            <a href="{% url 'praktikum:home' %}">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>


    <div class="footer">

        Praktikum Perencanaan Tambang

    </div>

</div>

</body>
</html>
