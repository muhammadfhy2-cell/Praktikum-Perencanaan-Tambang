<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login Peserta
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;
            color: #111827;
        }

        .login-container {
            width: min(430px, 92%);
        }

        .login-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 35px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .06);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            font-size: 25px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #111827;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            opacity: .88;
        }

        .message {
            padding: 12px;

            margin-bottom: 15px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 7px;

            font-size: 13px;

            line-height: 1.5;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            <h1>
                Login Peserta
            </h1>

            <p>
                Praktikum Perencanaan Tambang
            </p>

        </div>



        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}



        <form
            method="POST"
            action="{% url 'login_peserta' %}"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit">

                Masuk ke Dashboard

            </button>


        </form>


        <a
            href="/"
            class="back"
        >

            ← Kembali ke halaman utama

        </a>


    </div>

</div>


</body>

</html>
